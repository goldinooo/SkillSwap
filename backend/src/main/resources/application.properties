spring.application.name=backend

# --- Datasource ---------------------------------------------------------------
# Credentials come from the environment (see ../.env.example), never from this file.
# The defaults match .env.example, so `docker compose up -d` is enough to run locally.
# Real deployments override them with real environment variables.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:skillswap}
spring.datasource.username=${POSTGRES_USER:skillswap}
spring.datasource.password=${POSTGRES_PASSWORD:skillswap_local_dev}

# --- JPA ----------------------------------------------------------------------
# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Security / CORS ---------------------------------------------------------
# Origins allowed to call this API from a browser. Comma-separated, no wildcard:
# "*" is illegal together with allowCredentials and browsers reject it.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- JWT --------------------------------------------------------------------
# HS256 needs at least 32 bytes. The default below is a DEV value only: it is in a
# committed file, so anyone can forge a token with it. Real deployments must set
# APP_JWT_SECRET, and TokenService refuses to start if the key is too short.
app.jwt.secret=${APP_JWT_SECRET:dev-only-insecure-secret-change-me-32b!}
app.jwt.issuer=${APP_JWT_ISSUER:skillswap}
# Short, because an access JWT cannot be revoked: this is the whole window a stolen
# one stays useful.
app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${APP_JWT_REFRESH_TTL:30d}
app.jwt.two-factor-challenge-ttl=${APP_JWT_2FA_TTL:5m}

# --- Secret encryption -------------------------------------------------------
# AES-256 key, base64 of exactly 32 bytes. Encrypts users.two_factor_secret, which
# cannot be hashed because verifying a code means recomputing it. DEV value only.
app.security.encryption-key=${APP_ENCRYPTION_KEY:ZGV2LW9ubHktaW5zZWN1cmUta2V5LTMyLWJ5dGVzISE=}

# --- TOTP / OAuth2 -----------------------------------------------------------
# Shown as the account issuer in the authenticator app.
app.totp.issuer=${APP_TOTP_ISSUER:SkillSwap}
# Where the backend sends the browser after a successful provider login.
app.oauth2.success-redirect-uri=${APP_OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}

# --- Public API ---------------------------------------------------------------
# Per-API-key quota, enforced by publicapi/security/RateLimitFilter.
app.publicapi.requests-per-minute=${APP_PUBLICAPI_RPM:60}

# The bucket4j-spring-boot-starter is NOT used: it refuses to start without a cache
# provider and its 0.14.0 release targets Boot 3. RateLimitFilter uses the core
# token-bucket API directly, which arrives as a transitive dependency of the starter.
bucket4j.enabled=false

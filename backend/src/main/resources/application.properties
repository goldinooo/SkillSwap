spring.application.name=backend

# PostgreSQL is not available yet (planned as a Docker container). Remove these exclusions once a datasource is configured.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.JdbcClientAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayEndpointAutoConfiguration

# Bucket4j needs a cache configured at startup; keep it off until rate limiting is wired up.
bucket4j.enabled=false

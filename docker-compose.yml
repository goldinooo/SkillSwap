name: skillswap

services:
  postgres:
    image: postgres:17-alpine
    container_name: skillswap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - skillswap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Other services wait on this, and Flyway must not run against a half-started server.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  skillswap_postgres_data:
